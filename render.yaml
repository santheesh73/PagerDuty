# Render Blueprint for the free public demo (https://render.com/docs/blueprint-spec): ONE web
# service built from deploy/demo/Dockerfile (Django serves the API and the SPA; no Redis, no
# Celery) and a free Postgres. Nothing here costs money. New → Blueprint → this repo.
#
# docs/DEPLOY.md covers the limits (a free instance sleeps when idle; free Postgres expires after
# 30 days) and the tick scheduler. The full stack is deploy/render-full.yaml (workers are paid).
# Service names are unique per Render account: if `pulse-demo` is taken, rename it here and in
# CSRF_TRUSTED_ORIGINS / FRONTEND_URL.

databases:
  - name: pulse-demo-db
    databaseName: pulse
    user: pulse
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: pulse-demo
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/demo/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Copy it into the repository secret PULSE_TICK_SECRET to switch on .github/workflows/demo-tick.yml.
      - key: TICK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: pulse-demo-db, property: connectionString }
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pulse-demo.onrender.com
      - key: FRONTEND_URL
        value: https://pulse-demo.onrender.com
      # Render's proxy is the one hop in front of the container.
      - key: NUM_PROXIES
        value: "1"
