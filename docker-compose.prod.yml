# Production-like stack: the prod images (gunicorn + collectstatic, nginx serving the built
# SPA), prod settings, no source mounts. Useful as a smoke test and as a reference for
# deploying to any Docker host.
#
#   SECRET_KEY=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up --build -d
#   → http://localhost:8080
#
# Defaults are the safe ones: no demo data, no demo logins on the sign-in page. For a demo or
# a smoke test add  SEED_DEMO=1 SHOW_DEMO_CREDENTIALS=true  (`make doctor` does).
# For real deployments put TLS in front and set SECURE_COOKIES / SECURE_SSL_REDIRECT to 1,
# and point EMAIL_HOST at a real SMTP server instead of Mailpit.

x-api-env: &api-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. SECRET_KEY=$(openssl rand -hex 32)}
  DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
  REDIS_URL: redis://redis:6379/0
  ALLOWED_HOSTS: localhost,127.0.0.1,api
  CSRF_TRUSTED_ORIGINS: http://localhost:8080
  FRONTEND_URL: http://localhost:8080
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
  SECURE_COOKIES: ${SECURE_COOKIES:-0}
  # Production settings require MFA for team admins. This local/demo stack signs in as the demo
  # admin without one, so it is off here; set it to 1 (or drop the line) for a real deployment.
  REQUIRE_MFA_FOR_ADMINS: ${REQUIRE_MFA_FOR_ADMINS:-0}
  SEED_DEMO: ${SEED_DEMO:-0}
  API_DOCS: ${API_DOCS:-1} # Swagger UI at :8080/api/docs/; production deployments leave it off
  # nginx (the `web` service) is the only proxy in front of Django here and appends the peer
  # address to X-Forwarded-For, so trust exactly one hop. Behind another proxy/LB, raise it.
  NUM_PROXIES: ${NUM_PROXIES:-1}
  # Load tests raise the per-key Events API limit (the default is a protection, not a capacity).
  THROTTLE_EVENTS: ${THROTTLE_EVENTS:-120/min}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-pulse@localhost}
  # Observability, all off unless set (docs/OBSERVABILITY.md). /metrics answers 404 without a
  # token; HEARTBEAT_URL is the external dead-man's switch; SENTRY_* enables error reporting.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  HEARTBEAT_URL: ${HEARTBEAT_URL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${GIT_SHA:-}

x-api: &api
  build:
    context: ./backend
    target: prod
  environment: *api-env
  restart: unless-stopped

x-worker-health: &worker-health
  test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null"]
  interval: 15s
  timeout: 10s
  retries: 4
  start_period: 20s

services:
  db:
    image: postgres:18-alpine
    environment: { POSTGRES_USER: pulse, POSTGRES_PASSWORD: pulse, POSTGRES_DB: pulse }
    volumes: [pgdata-prod:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"], interval: 3s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["127.0.0.1:8025:8025"] # inbox UI and API for the smoke test; SMTP (1025) stays internal
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 5s, retries: 12 }
    restart: unless-stopped

  # Scheduled pg_dump backups into the `backups-prod` volume (see docs/DATA_SAFETY.md). The first
  # runs at start; set BACKUP_S3_* to also upload off the host, BACKUP_HEARTBEAT_URL to be alerted
  # when they stop. Unhealthy means the last good backup is older than twice the interval.
  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETAIN_DAILY: ${BACKUP_RETAIN_DAILY:-7}
      BACKUP_RETAIN_WEEKLY: ${BACKUP_RETAIN_WEEKLY:-4}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-pulse}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes: [backups-prod:/backups]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/last-backup-ok -mmin -$$(( (${BACKUP_INTERVAL_SECONDS:-86400} * 2) / 60 + 5 )) 2>/dev/null | grep -q ."]
      interval: 30s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  api:
    <<: *api
    command: ["api"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 60
      start_period: 15s

  # Paging gets a worker that consumes nothing else, so a notification backlog can never
  # delay an escalation. (-Q order alone is not a priority: kombu round-robins its queues.)
  worker-escalations:
    <<: *api
    command: ["worker"]
    environment:
      <<: *api-env
      CELERY_QUEUES: escalations
      CELERY_CONCURRENCY: "2"
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *worker-health

  worker:
    <<: *api
    command: ["worker"]
    environment:
      <<: *api-env
      CELERY_QUEUES: notifications,default
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *worker-health

  beat:
    <<: *api
    command: ["beat"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      # Exactly one beat process must be alive (two would double every sweep).
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys
          def cmd(p):
              try:
                  return open(f"/proc/{p}/cmdline", "rb").read()
              except OSError:
                  return b""
          me = str(os.getpid())
          n = sum(1 for p in os.listdir("/proc") if p.isdigit() and p != me and b"celery" in cmd(p) and b"beat" in cmd(p))
          sys.exit(0 if n == 1 else 1)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_SHOW_DEMO_CREDENTIALS: ${SHOW_DEMO_CREDENTIALS:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_RELEASE: ${GIT_SHA:-}
    environment:
      PORT: "8080"
      API_UPSTREAM: http://api:8000
      CSP_MODE: ${CSP_MODE:-enforce}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
    ports: ["8080:8080"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget tries ::1 first and does not fall back, and our
      # nginx template listens on IPv4 only, so "localhost" fails on any host with IPv6 enabled
      # (GitHub's runners). Found by CI, not by a machine with IPv6 off.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata-prod:
  backups-prod:
