# Optional Prometheus + Grafana next to the prod-like stack:
#
#   export METRICS_TOKEN=$(openssl rand -hex 24)
#   export SECRET_KEY=$(openssl rand -hex 32)
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Prometheus http://localhost:9090   Grafana http://localhost:3000 (admin / $GRAFANA_PASSWORD)
# Neither is part of the default stack: Pulse works, and /metrics stays disabled (404), without it.

services:
  api:
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/pulse.json:/var/lib/grafana/dashboards/pulse.json:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  prometheus-data:
  grafana-data:
