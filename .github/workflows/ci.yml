name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379/0
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      # The backup-script tests run the real pg_dump, which must match the server's major version.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Migrations are safe to run on a live database
        run: DJANGO_SETTINGS_MODULE=config.settings.lint uv run python manage.py lintmigrations
      - name: OpenAPI schema is valid and committed
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff -u openapi.yaml /tmp/openapi.yaml
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=85 --junitxml=pytest.xml
      - name: README numbers match this run (invariants, mutations, tests, coverage)
        run: python3 ../scripts/readme_numbers.py --check --junit pytest.xml --coverage coverage.xml
      - name: Coverage summary
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=vitest.json
      - name: README numbers match this run (frontend tests)
        run: python3 ../scripts/readme_numbers.py --check --vitest vitest.json
      - run: npm run build
      - name: Bundle budget, and no dev URLs or secrets in the bundle
        run: npm run check:bundle

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Backend (prod target)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          target: prod
          push: false
          load: true
          tags: pulse-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Backup image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ops/backup/Dockerfile
          push: false
          load: true
          tags: pulse-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: Frontend (prod target)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          target: prod
          push: false
          load: true
          tags: pulse-web:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Demo image (one container)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/demo/Dockerfile
          push: false
          load: true
          tags: pulse-demo:ci
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo
      - name: Install Trivy (pinned version, checksum-verified)
        run: ./scripts/install-trivy.sh "$RUNNER_TEMP/bin"
      - name: SBOM per image (CycloneDX)
        run: |
          mkdir -p sbom
          for image in backend web backup demo; do
            "$RUNNER_TEMP/bin/trivy" image --quiet --format cyclonedx \
              --output "sbom/pulse-$image.cdx.json" "pulse-$image:ci"
          done
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-images
          path: sbom/
      - name: Images have no fixable HIGH or CRITICAL vulnerabilities (Trivy)
        run: |
          for image in pulse-backend:ci pulse-web:ci pulse-backup:ci pulse-demo:ci; do
            "$RUNNER_TEMP/bin/trivy" image --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image"
          done

  supply-chain:
    name: Supply chain (pip-audit · npm audit · Trivy fs · SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
      - name: Python dependencies have no known vulnerabilities (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.0 --strict --disable-pip --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22"
      - name: npm dependencies have no high or critical advisories
        run: |
          (cd frontend && npm audit --audit-level=high)
          (cd e2e && npm audit --audit-level=high)
      - name: Install Trivy (pinned version, checksum-verified)
        run: ./scripts/install-trivy.sh "$RUNNER_TEMP/bin"
      - name: Lockfiles, Dockerfiles and committed secrets (Trivy fs)
        run: |
          "$RUNNER_TEMP/bin/trivy" fs --no-progress --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Source SBOM (CycloneDX)
        run: |
          "$RUNNER_TEMP/bin/trivy" fs --quiet --format cyclonedx --include-dev-deps \
            --output sbom-source.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: sbom-source.cdx.json

  e2e:
    name: E2E + load smoke (Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-not-a-secret
      # The prod compose defaults to no demo data and no demo logins; the journey needs both.
      SEED_DEMO: "1"
      SHOW_DEMO_CREDENTIALS: "true"
      # The default 120/min per-key limit protects production; the smoke run needs headroom.
      THROTTLE_EVENTS: 100000/min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start the production-like stack
        run: docker compose -f docker-compose.prod.yml up --build -d --wait --wait-timeout 300
      - name: Load smoke (k6) and database invariants
        run: |
          KEY=$(docker compose -f docker-compose.prod.yml exec -T api python manage.py routing_key checkout-api | tail -1)
          RUN=ci$GITHUB_RUN_ID
          mkdir -p k6out && chmod 777 k6out
          docker run --rm --network host -v "$PWD/loadtest:/loadtest:ro" -v "$PWD/k6out:/out" \
            grafana/k6:2.3.0 run --quiet -e BASE_URL=http://localhost:8080 -e ROUTING_KEY="$KEY" \
            -e RUN_ID="$RUN" -e DURATION=15s -e VUS=8 /loadtest/events.js
          NEW=$(python3 -c "import json;print(json.load(open('k6out/summary.json'))['metrics']['pulse_new_keys']['values']['count'])")
          HOT=$(python3 -c "import json;print(json.load(open('k6out/summary.json'))['metrics']['pulse_hot_requests']['values']['count'])")
          docker compose -f docker-compose.prod.yml exec -T api python - --run-id "$RUN" --new-keys "$NEW" --hot-requests "$HOT" < loadtest/verify.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser journey (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200

  docker-smoke:
    name: Docker stack doctor (boot, flow, failure drills)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Boots the prod-like stack from scratch, drives the whole alert flow, then kills Redis,
      # the workers, the database and the API in turn and checks it recovers. See scripts/doctor.py.
      - name: make doctor
        run: ./scripts/doctor.sh
      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-logs
          path: doctor-logs.txt

  demo-doctor:
    name: Demo doctor (one container, no Redis, no Celery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Boots docker-compose.demo.yml (Postgres, Mailpit and the one demo container), plays the
      # external scheduler against /internal/tick/, and runs the alert flow and the database and
      # API drills. Escalation has to work through the tick alone.
      - name: make doctor-demo
        run: DOCTOR_MODE=demo DOCTOR_LOGS=doctor-demo-logs.txt ./scripts/doctor.sh
      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-demo-logs
          path: doctor-demo-logs.txt

  ops-rules:
    name: Ops (promtool alert rules · Grafana JSON · compose overlay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Alert rules and Prometheus config are valid
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops:/ops:ro" prom/prometheus:v3.5.0 check rules /ops/alerts.yml
          # Every alert fires on synthetic series and resolves (ops/alerts_test.yml).
          docker run --rm --entrypoint promtool -v "$PWD/ops:/ops:ro" prom/prometheus:v3.5.0 test rules /ops/alerts_test.yml
          # The scrape config references a secret file that only exists inside the stack.
          docker run --rm --entrypoint promtool -v "$PWD/ops:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config --syntax-only /etc/prometheus/prometheus.yml
      - name: Dashboard is valid JSON
        run: python3 -m json.tool ops/grafana/pulse.json >/dev/null
      - name: Observability compose overlay resolves
        run: |
          SECRET_KEY=x METRICS_TOKEN=t GRAFANA_PASSWORD=p \
            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml config -q
      - name: Production overlay resolves, and Caddy accepts its config
        run: |
          export DOMAIN=pulse.example.com ACME_EMAIL=ops@example.com SECRET_KEY=x \
            POSTGRES_PASSWORD=p EMAIL_HOST=smtp.example.com PULSE_TAG=ci
          docker compose -f docker-compose.prod.yml -f deploy/compose.production.yml config -q
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Demo compose file resolves
        run: SECRET_KEY=x TICK_SECRET=t docker compose -f docker-compose.demo.yml config -q
      - name: Shell scripts pass shellcheck
        run: |
          shellcheck scripts/deploy.sh scripts/smoke.sh scripts/doctor.sh \
            scripts/install-trivy.sh scripts/record_demo.sh scripts/backup.sh scripts/restore.sh

  backup-drill:
    name: Backup drill (backup · restore · compare · boot API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
        working-directory: backend
      # pg_dump refuses to dump a newer server, so the client must be the server's major version.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: make backup-drill
        run: ./scripts/backup_drill.sh
