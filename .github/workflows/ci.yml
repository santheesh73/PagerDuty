name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Django System Checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: incident_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py check

      - name: Run Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: incident_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest
        run: |
          cd frontend
          npm test

      - name: Production Build
        run: |
          cd frontend
          npm run build
