name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379/0
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and committed
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff -u openapi.yaml /tmp/openapi.yaml
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=85
      - name: Coverage summary
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend (prod target)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend (prod target)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  e2e:
    name: E2E + load smoke (Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-not-a-secret
      # The prod compose defaults to no demo data and no demo logins; the journey needs both.
      SEED_DEMO: "1"
      SHOW_DEMO_CREDENTIALS: "true"
      # The default 120/min per-key limit protects production; the smoke run needs headroom.
      THROTTLE_EVENTS: 100000/min
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start the production-like stack
        run: docker compose -f docker-compose.prod.yml up --build -d --wait --wait-timeout 300
      - name: Load smoke (k6) and database invariants
        run: |
          KEY=$(docker compose -f docker-compose.prod.yml exec -T api python manage.py routing_key checkout-api | tail -1)
          RUN=ci$GITHUB_RUN_ID
          mkdir -p k6out && chmod 777 k6out
          docker run --rm --network host -v "$PWD/loadtest:/loadtest:ro" -v "$PWD/k6out:/out" \
            grafana/k6:2.3.0 run --quiet -e BASE_URL=http://localhost:8080 -e ROUTING_KEY="$KEY" \
            -e RUN_ID="$RUN" -e DURATION=15s -e VUS=8 /loadtest/events.js
          NEW=$(python3 -c "import json;print(json.load(open('k6out/summary.json'))['metrics']['pulse_new_keys']['values']['count'])")
          HOT=$(python3 -c "import json;print(json.load(open('k6out/summary.json'))['metrics']['pulse_hot_requests']['values']['count'])")
          docker compose -f docker-compose.prod.yml exec -T api python - --run-id "$RUN" --new-keys "$NEW" --hot-requests "$HOT" < loadtest/verify.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser journey (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200

  docker-smoke:
    name: Docker stack doctor (boot, flow, failure drills)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Boots the prod-like stack from scratch, drives the whole alert flow, then kills Redis,
      # the workers, the database and the API in turn and checks it recovers. See scripts/doctor.py.
      - name: make doctor
        run: ./scripts/doctor.sh
      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-logs
          path: doctor-logs.txt
