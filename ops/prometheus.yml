# Scrape config for the optional observability stack (docker-compose.observability.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulse-api
    metrics_path: /metrics
    # The token never lives in this file: compose mounts it as a secret from METRICS_TOKEN.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
