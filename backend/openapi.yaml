      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/incidents/{id}/notes/:
    post:
      operationId: incidents_notes_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      tags:
      - incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEvent'
          description: ''
  /api/v1/incidents/{id}/reassign/:
    post:
      operationId: incidents_reassign_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      tags:
      - incidents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/incidents/{id}/resolve/:
    post:
      operationId: incidents_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      tags:
      - incidents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/incidents/{id}/timeline/:
    get:
      operationId: incidents_timeline_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - incidents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIncidentEventList'
          description: ''
  /api/v1/incidents/{id}/unacknowledge/:
    post:
      operationId: incidents_unacknowledge_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      tags:
      - incidents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: 'Current user. Also the SPA''s bootstrap call: it always sets the
        CSRF cookie.'
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: 'Current user. Also the SPA''s bootstrap call: it always sets the
        CSRF cookie.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      description: 'Your in-app inbox. Only in-app rows: email copies are delivery
        records, not inbox items.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: unread
        schema:
          type: boolean
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
