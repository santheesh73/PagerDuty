      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: ''
    delete:
      operationId: schedules_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this schedule.
        required: true
      tags:
      - schedules
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/schedules/{id}/oncall/:
    get:
      operationId: schedules_oncall_retrieve
      parameters:
      - in: query
        name: at
        schema:
          type: string
          format: date-time
        description: Defaults to now
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this schedule.
        required: true
      tags:
      - schedules
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnCallNow'
          description: ''
  /api/v1/schedules/{id}/shifts/:
    get:
      operationId: schedules_shifts_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this schedule.
        required: true
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: Defaults to now
      - in: query
        name: team
        schema:
          type: integer
      - in: query
        name: until
        schema:
          type: string
          format: date-time
        description: Defaults to since + 7 days
      tags:
      - schedules
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
          description: ''
  /api/v1/schedules/{schedule_pk}/overrides/:
    get:
      operationId: schedules_overrides_list
      description: /schedules/{schedule_pk}/overrides/ — members read, team admins
        write.
      parameters:
      - in: path
        name: schedule_pk
        schema:
          type: integer
        required: true
      tags:
      - schedules
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Override'
          description: ''
    post:
      operationId: schedules_overrides_create
      description: /schedules/{schedule_pk}/overrides/ — members read, team admins
        write.
      parameters:
      - in: path
        name: schedule_pk
        schema:
          type: integer
        required: true
      tags:
      - schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Override'
          description: ''
