          type: integer
        name:
          type: string
          maxLength: 120
        description:
          type: string
        escalation_policy:
          type: integer
        escalation_policy_name:
          type: string
          readOnly: true
        integration_key:
          type: string
          nullable: true
          readOnly: true
          description: Only team admins see the key; everyone else gets null.
        mode:
          allOf:
          - $ref: '#/components/schemas/ServiceModeEnum'
          readOnly: true
        mode_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        open_incidents:
          allOf:
          - $ref: '#/components/schemas/OpenCounts'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - escalation_policy
      - escalation_policy_name
      - id
      - integration_key
      - mode
      - mode_until
      - name
      - open_incidents
      - team
      - updated_at
    ServiceModeEnum:
      enum:
      - active
      - maintenance
      - debug
      type: string
      description: |-
        * `active` - Active
        * `maintenance` - Maintenance
        * `debug` - Debug
    ServiceModeRequest:
      type: object
      description: |-
        Maintenance and debug suppress paging, so both need a bounded window.

        Without one, a service quietly stops paging for good and nobody finds out until an
        outage goes unanswered. `expire_service_modes` only reclaims services that have a
        `mode_until`, so an open-ended window would never be swept back to active.
      properties:
        mode:
          $ref: '#/components/schemas/ServiceModeEnum'
        until:
          type: string
          format: date-time
          nullable: true
      required:
      - mode
    ServiceRequest:
      type: object
      properties:
        team:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        escalation_policy:
          type: integer
      required:
      - escalation_policy
      - name
      - team
    SeverityEnum:
      enum:
