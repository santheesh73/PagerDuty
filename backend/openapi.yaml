      operationId: oncalls_list
      description: Who would be paged right now, for every level of every policy you
        can see.
      tags:
      - oncalls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnCallPolicy'
          description: ''
  /api/v1/schedules/:
