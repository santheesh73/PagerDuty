        start:
          type: string
          format: date-time
        handoff_time:
          type: string
          format: time
        members:
          type: array
          items:
            type: integer
            minimum: 1
      required:
      - handoff_time
      - members
      - name
      - rotation_type
      - start
    LoginRequest:
