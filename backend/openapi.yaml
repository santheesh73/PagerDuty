openapi: 3.0.3
info:
  title: Pulse API
  version: 1.0.0
  description: 'Incident orchestration: Events ingest, incidents, escalation, on-call.'
paths:
  /api/v1/analytics/summary/:
    get:
      operationId: analytics_summary_retrieve
      parameters:
      - in: query
        name: service
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601, default 30 days ago
      - in: query
        name: team
        schema:
          type: integer
      - in: query
        name: until
        schema:
          type: string
        description: ISO-8601, default now
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
          description: ''
  /api/v1/analytics/timeseries/:
    get:
      operationId: analytics_timeseries_list
      parameters:
      - in: query
        name: service
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601, default 30 days ago
      - in: query
        name: team
        schema:
          type: integer
      - in: query
        name: tz
        schema:
          type: string
        description: IANA zone; default your profile's
      - in: query
        name: until
        schema:
          type: string
        description: ISO-8601, default now
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayPoint'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie for anonymous visitors (the login page).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/escalation-policies/:
    get:
      operationId: escalation_policies_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: team
        schema:
          type: integer
      tags:
      - escalation-policies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEscalationPolicyList'
          description: ''
    post:
      operationId: escalation_policies_create
      tags:
      - escalation-policies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationPolicyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EscalationPolicyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EscalationPolicyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
          description: ''
  /api/v1/escalation-policies/{id}/:
    get:
      operationId: escalation_policies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this escalation policy.
        required: true
      tags:
      - escalation-policies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
          description: ''
    put:
      operationId: escalation_policies_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this escalation policy.
        required: true
      tags:
      - escalation-policies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationPolicyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EscalationPolicyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EscalationPolicyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
          description: ''
    patch:
      operationId: escalation_policies_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this escalation policy.
        required: true
      tags:
      - escalation-policies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEscalationPolicyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEscalationPolicyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEscalationPolicyRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
          description: ''
    delete:
      operationId: escalation_policies_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this escalation policy.
        required: true
      tags:
      - escalation-policies
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/events/:
    post:
      operationId: events_create
      description: |-
        Events API v1. Authenticated solely by `routing_key` (a service's integration key).

        No session, no CSRF: monitoring systems post here directly.
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
            examples:
              Trigger:
                value:
                  routing_key: <integration key>
                  event_action: trigger
                  dedup_key: db-1/disk
                  payload:
                    summary: Disk 95% full on db-1
                    severity: critical
                    source: prometheus
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResult'
          description: ''
  /api/v1/incidents/:
    get:
      operationId: incidents_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: A user id, or `me`
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: 'Title text, #number or exact dedup key'
      - in: query
        name: service
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601; triggered at or after
      - in: query
        name: status
        schema:
          type: string
        description: 'Comma-separated: triggered,acknowledged,resolved'
      - in: query
        name: team
        schema:
          type: integer
      - in: query
        name: until
        schema:
          type: string
        description: ISO-8601; triggered before
      - in: query
        name: urgency
        schema:
          type: string
          enum:
          - high
          - low
      tags:
      - incidents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIncidentList'
          description: ''
  /api/v1/incidents/{id}/:
    get:
      operationId: incidents_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      tags:
      - incidents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/incidents/{id}/acknowledge/:
    post:
      operationId: incidents_acknowledge_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this incident.
        required: true
      tags:
