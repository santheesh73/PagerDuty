components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dedup_key:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        summary:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
        payload:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          readOnly: true
        received_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - dedup_key
      - id
      - payload
      - received_at
      - severity
      - source
      - status
      - summary
    AlertStatusEnum:
      enum:
      - triggered
      - acknowledged
      - resolved
      - suppressed
      type: string
      description: |-
        * `triggered` - Triggered
        * `acknowledged` - Acknowledged
        * `resolved` - Resolved
        * `suppressed` - Suppressed
    ChannelEnum:
      enum:
      - in_app
      - email
      type: string
      description: |-
        * `in_app` - In-app
        * `email` - Email
    Count:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    DayPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        incidents:
          type: integer
        high:
          type: integer
        low:
          type: integer
        time_to_first_response_seconds:
          type: number
          format: double
          nullable: true
        mtta_seconds:
          type: number
          format: double
          nullable: true
        mttr_seconds:
          type: number
          format: double
          nullable: true
      required:
      - date
      - high
      - incidents
      - low
      - mtta_seconds
      - mttr_seconds
      - time_to_first_response_seconds
    EscalationPolicy:
      type: object
      description: A policy and its ordered levels. Writes replace `rules` wholesale,
        atomically.
      properties:
        id:
          type: integer
          readOnly: true
        team:
          type: integer
        name:
          type: string
          maxLength: 120
        num_loops:
          type: integer
          maximum: 3
          minimum: 0
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        services:
          type: array
          items:
            $ref: '#/components/schemas/PolicyService'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - num_loops
      - rules
      - services
      - team
      - updated_at
    EscalationPolicyRequest:
      type: object
      description: A policy and its ordered levels. Writes replace `rules` wholesale,
        atomically.
      properties:
        team:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 120
        num_loops:
          type: integer
          maximum: 3
          minimum: 0
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleRequest'
      required:
      - name
      - rules
      - team
    EventActionEnum:
      enum:
      - trigger
      - acknowledge
      - resolve
      type: string
      description: |-
        * `trigger` - trigger
        * `acknowledge` - acknowledge
        * `resolve` - resolve
    EventPayloadRequest:
      type: object
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 1024
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        source:
          type: string
          minLength: 1
          maxLength: 255
        custom_details: {}
      required:
      - severity
      - source
      - summary
    EventRequest:
      type: object
      properties:
        routing_key:
          type: string
          minLength: 1
          maxLength: 64
        event_action:
          $ref: '#/components/schemas/EventActionEnum'
        dedup_key:
          type: string
          maxLength: 255
        payload:
          $ref: '#/components/schemas/EventPayloadRequest'
      required:
      - event_action
      - routing_key
    EventResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EventResultStatusEnum'
        dedup_key:
          type: string
        incident_id:
          type: integer
          nullable: true
      required:
      - dedup_key
      - incident_id
      - status
    EventResultStatusEnum:
      enum:
      - accepted
      - ignored
      type: string
      description: |-
        * `accepted` - accepted
        * `ignored` - ignored
    Incident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IncidentStatusEnum'
          readOnly: true
          default: triggered
        urgency:
          allOf:
          - $ref: '#/components/schemas/UrgencyEnum'
          readOnly: true
        service:
          allOf:
          - $ref: '#/components/schemas/IncidentService'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          nullable: true
        dedup_key:
          type: string
          readOnly: true
        is_maintenance:
          type: boolean
          readOnly: true
        escalation_level:
          type: integer
          readOnly: true
        escalation_loop:
          type: integer
          readOnly: true
        next_escalation_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        first_response_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        alert_count:
          type: integer
          readOnly: true
        allowed_actions:
          type: array
          items:
            type: string
          readOnly: true
          description: Actions the requester may take right now, given status and
            team role.
      required:
      - acknowledged_at
      - alert_count
      - allowed_actions
      - assignee
      - dedup_key
      - escalation_level
      - escalation_loop
      - first_response_at
      - id
      - is_maintenance
      - next_escalation_at
      - number
      - resolved_at
      - service
      - status
      - title
      - triggered_at
      - urgency
    IncidentDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IncidentStatusEnum'
          readOnly: true
          default: triggered
        urgency:
          allOf:
          - $ref: '#/components/schemas/UrgencyEnum'
          readOnly: true
        service:
          allOf:
          - $ref: '#/components/schemas/IncidentService'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          nullable: true
        dedup_key:
          type: string
          readOnly: true
        is_maintenance:
          type: boolean
          readOnly: true
        escalation_level:
          type: integer
          readOnly: true
        escalation_loop:
          type: integer
          readOnly: true
        next_escalation_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        first_response_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        alert_count:
          type: integer
          readOnly: true
        allowed_actions:
          type: array
          items:
            type: string
          readOnly: true
          description: Actions the requester may take right now, given status and
            team role.
        escalation_snapshot:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - acknowledged_at
      - alert_count
      - allowed_actions
      - assignee
      - dedup_key
      - escalation_level
      - escalation_loop
      - escalation_snapshot
      - first_response_at
      - id
      - is_maintenance
      - next_escalation_at
      - number
      - resolved_at
      - service
      - status
      - title
      - triggered_at
      - urgency
    IncidentEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/IncidentEventTypeEnum'
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          nullable: true
        message:
          type: string
          readOnly: true
        data:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - data
      - id
      - message
      - type
    IncidentEventTypeEnum:
      enum:
      - triggered
      - alert_attached
      - acknowledged
      - unacknowledged
      - resolved
      - reassigned
      - escalated
      - manual_escalated
      - no_responder
      - escalation_exhausted
      - note_added
      - notified
      - notification_failed
      - maintenance_started
      - maintenance_ended
      type: string
      description: |-
        * `triggered` - Triggered
        * `alert_attached` - Alert Attached
        * `acknowledged` - Acknowledged
        * `unacknowledged` - Unacknowledged
        * `resolved` - Resolved
        * `reassigned` - Reassigned
        * `escalated` - Escalated
        * `manual_escalated` - Manual Escalated
        * `no_responder` - No Responder
        * `escalation_exhausted` - Escalation Exhausted
        * `note_added` - Note Added
        * `notified` - Notified
        * `notification_failed` - Notification Failed
        * `maintenance_started` - Maintenance Started
        * `maintenance_ended` - Maintenance Ended
    IncidentRef:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
        status:
          type: string
        urgency:
          type: string
