# Serves the SPA and proxies API/admin traffic to Django, so the browser only ever sees one
# origin (session cookie + CSRF work without CORS).

# Behind another proxy (Render, Fly, a load balancer) keep its scheme; otherwise use ours.
map $http_x_forwarded_proto $pulse_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;  # no nginx version in Server headers or error pages

    # /a/ is the one-tap acknowledge/resolve page from pages (SMS, email, webhooks): Django's.
    location ~ ^/(api|admin|static|healthz|readyz|a/) {
        proxy_pass ${API_UPSTREAM};
        # Route by the upstream's own name, but tell Django which host the browser used, so
        # absolute URLs (pagination links, redirects) point back at this origin.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $pulse_forwarded_proto;
        # Append our view of the peer to whatever the client sent. Django (NUM_PROXIES) reads
        # the entry we appended from the right, so a spoofed prefix can't pick its own
        # throttle bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_ssl_server_name on;
    }

    # Static responses carry the headers written by docker/15-pulse-headers.envsh (Django sets its
    # own on API responses). nginx only inherits add_header when a location sets none, hence the
    # include in each location.
    # Hashed assets never change; the HTML shell must always be fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/pulse-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/pulse-headers.conf;
        try_files $uri /index.html;
    }
}
